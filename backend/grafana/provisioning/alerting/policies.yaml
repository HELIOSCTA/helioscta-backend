apiVersion: 1

policies:
  - orgId: 1
    receiver: pagerduty-default
    group_by: ['grafana_folder', 'alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: pagerduty-default
        object_matchers:
          - ['team', '=', 'helioscta-positions']
        group_by: ['alertname', 'event']
