name: helioscta-power-pjm

prefect-version: 3.0.0

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:

  # ────── PJM Day-Ahead Hourly LMPs ──────
  # Daily poll for next-day DA prices with tenacity retries

  - name: Power - PJM DA HRL LMPs
    entrypoint: schedulers/prefect/power/pjm/pjm_da_hrl_lmps_flows.py:pjm_da_hrl_lmps
    work_pool:
      name: default-agent-pool
      work_queue_name: default
    tags: [pjm, power, da_hrl_lmps]
    schedules:

      # ────── Daily run at 11:00 AM MST (1:00 PM EPT), polls every 10s until data lands ──────
      - cron: "0 11 * * *"
        timezone: "America/Denver"

  # ────── PJM Day-Ahead Hourly LMPs Backfill ──────
  # 7-day lookback backfill, no polling

  - name: Power - PJM DA HRL LMPs Backfill
    entrypoint: schedulers/prefect/power/pjm/pjm_da_hrl_lmps_flows.py:pjm_da_hrl_lmps_backfill
    work_pool:
      name: default-agent-pool
      work_queue_name: default
    tags: [pjm, power, da_hrl_lmps, backfill]
    schedules:

      # ────── Daily backfill at 6:00 AM MST, data already available ──────
      - cron: "0 6 * * *"
        timezone: "America/Denver"
