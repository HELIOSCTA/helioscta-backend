services:
  # ── Dagster ────────────────────────────────────────────────────────
  dagster-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - dagster-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  dagster-webserver:
    build:
      context: ..
      dockerfile: backend/Dockerfile.dagster
    command: dagster-webserver -w backend/orchestration/workspace.yaml -h 0.0.0.0 -p 7777
    ports:
      - "127.0.0.1:7777:7777"
      - "[::1]:7777:7777"
    environment:
      - DAGSTER_HOME=/app/backend/orchestration
      - DAGSTER_PG_URL=postgresql://dagster:dagster@dagster-db:5432/dagster
    env_file:
      - .env.shared
      - .env.${BACKEND_ENV:-prod}
    depends_on:
      dagster-db:
        condition: service_healthy

  dagster-daemon:
    image: helioscta-backend-dagster-webserver
    command: dagster-daemon run -w backend/orchestration/workspace.yaml
    environment:
      - DAGSTER_HOME=/app/backend/orchestration
      - DAGSTER_PG_URL=postgresql://dagster:dagster@dagster-db:5432/dagster
    env_file:
      - .env.shared
      - .env.${BACKEND_ENV:-prod}
    depends_on:
      dagster-db:
        condition: service_healthy

volumes:
  dagster-db-data:
