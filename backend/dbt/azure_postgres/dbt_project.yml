name: helioscta_marts
version: 0.1.0
profile: helioscta_marts

# Use this project's directory for everything (DBT defaults a few of
# these to the current working dir; pinning them here makes
# --project-dir invocations behave identically no matter where they're
# called from).
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"        # compiled SQL lands here
clean-targets:
  - "target"
  - "dbt_packages"

models:
  helioscta_marts:
    # Default for everything under models/. Individual files can
    # override via {{ config(...) }} blocks.
    +materialized: view
    # Models are organized by SOURCE schema, not by layer. Each
    # subfolder under models/ corresponds to the underlying Postgres
    # schema its models draw from. When a new source needs marts,
    # add a folder here (eia/, pjm/, …) and a matching schema entry.
    ice_python:
      # Compiled DDL targets <schema>_marts on `dbt run`. In compile-
      # only mode this only affects the rendered identifier — no
      # writes happen.
      +schema: ice_python_marts
