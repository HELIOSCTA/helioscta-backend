# Frontend deploy → Vercel
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — personal token scoped to the HeliosCTA Vercel org
#   VERCEL_ORG_ID      — team_77WKRymvMffvWvYH6Q900QMH
#   VERCEL_PROJECT_ID  — prj_qTtGLtV7ok6nLyTvubBTT7zAdUFX
#
# Branch policy:
#   main             → production deploy (--prod)
#   backend-cleanup  → preview deploy
#
# Notes:
# - Reuses the existing Vercel project (helioscta-gas-frontend); do
#   not create a new one. Domains, env vars, and analytics live there.
# - After this workflow is proven, disconnect the legacy Vercel ↔
#   helioscta-gas-frontend GitHub integration in the Vercel dashboard
#   to avoid double-deploys.
# - The path filter keeps backend-only pushes from redeploying the
#   frontend.

name: frontend-deploy

on:
  push:
    branches: [backend-cleanup, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (if present)
        run: npm test --if-present

      - name: Compute Vercel environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        # Creates .vercel/.env.<env>.local with project env vars so the
        # subsequent `vercel build` has DB/auth credentials available.
        # We rely on this single build step (rather than running
        # `npm run build` first as a separate gate) because the app
        # reads env vars at module-load and `npm run build` without the
        # pulled env would fail in CI.
        run: npx vercel@latest pull --yes --environment=${{ steps.env.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: npx vercel@latest build ${{ steps.env.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(npx vercel@latest deploy --prebuilt ${{ steps.env.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "${{ steps.env.outputs.env }} deploy: $URL" >> "$GITHUB_STEP_SUMMARY"
